# Frontend on GitHub Pages: build with the live access URL (github-pages Environment variable VITE_ACCESS_URL) and deploy on main.
# Thin by design: provision the devbox toolchain, then run tasks. No caches: this workflow publishes.
# Until VITE_ACCESS_URL is set, the build and deploy jobs are skipped (not failed).
# Local equivalent: VITE_ACCESS_URL=https://<domain> devbox run -- task frontend:build:pages
name: Pages

on:
  push:
    branches: [main]
    paths:
      - src/frontend/**
      - src/contracts/openapi/access/**
      - .github/workflows/pages.yml
      - Taskfile.yml
      - devbox.json
      - devbox.lock
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Environment variables are not visible in a job-level `if` of the job that uses the environment,
  # so the check runs here and the build and deploy jobs read its output.
  configured:
    name: "pages: check configuration"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: github-pages
    permissions: {}
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          VITE_ACCESS_URL: ${{ vars.VITE_ACCESS_URL }}
        run: |
          if [ -n "$VITE_ACCESS_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VITE_ACCESS_URL is not set on the github-pages Environment; skipping the Pages build and deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: "pages: build"
    needs: configured
    if: ${{ needs.configured.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-pages
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install devbox toolchain
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: false

      - name: Set up
        run: devbox run -- task frontend:setup

      - name: Build for Pages
        env:
          VITE_ACCESS_URL: ${{ vars.VITE_ACCESS_URL }}
        run: devbox run -- task frontend:build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src/frontend/dist

  deploy:
    name: "pages: deploy"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
