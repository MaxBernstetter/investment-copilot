# Access service: lint, types and unit tests. Runs on every pull request, and on pushes to
# main when the service, the contracts it consumes, or the toolchain change.
# Thin by design: provision the devbox toolchain, then run the same tasks as locally.
# See docs/architecture/13-build-and-ci.md.
#
# Local equivalent: devbox run -- task access:<task>
name: Access

on:
  push:
    branches: [main]
    paths:
      - src/services/access/**
      - src/contracts/**
      - .github/workflows/access.yml
      - Taskfile.yml
      - devbox.json
      - devbox.lock
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: "access: lint, types, unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install devbox toolchain
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true

      - name: Cache uv packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('src/services/access/uv.lock') }}

      - name: Set up
        run: devbox run -- task access:setup

      - name: Lint
        run: devbox run -- task access:lint

      - name: Type-check
        run: devbox run -- task access:typecheck

      - name: Unit tests
        run: devbox run -- task access:test:unit
