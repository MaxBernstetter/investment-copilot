# Orchestration (Airflow DAGs): lint, type check and unit tests.
# Thin by design: provision the devbox toolchain, then run the same tasks
# developers run locally. See docs/architecture/13-build-and-ci.md.
#
# Local equivalent: devbox run -- task orchestration:setup orchestration:lint orchestration:typecheck orchestration:test:unit
name: Orchestration

on:
  push:
    branches: [main]
    paths:
      - src/orchestration/**
      - .github/workflows/orchestration.yml
      - Taskfile.yml
      - devbox.json
      - devbox.lock
  pull_request:
    paths:
      - src/orchestration/**
      - .github/workflows/orchestration.yml
      - Taskfile.yml
      - devbox.json
      - devbox.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orchestration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install devbox toolchain
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true

      - name: Cache uv packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-orchestration-${{ runner.os }}-${{ hashFiles('src/orchestration/uv.lock') }}

      - name: Set up environment
        run: devbox run -- task orchestration:setup

      - name: Lint
        run: devbox run -- task orchestration:lint

      - name: Type check
        run: devbox run -- task orchestration:typecheck

      - name: Unit tests
        run: devbox run -- task orchestration:test:unit
