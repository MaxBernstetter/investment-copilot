# Service images: multi-arch build, Trivy scan, publish to GHCR on main.
# Thin by design: provision the devbox toolchain, then run the same tasks
# developers run locally. See docs/architecture/13-build-and-ci.md.
#
# Local equivalent: devbox run -- task <service>:image && devbox run -- task <service>:image:scan
name: Images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel their older runs; every push to main is its own group, so publishing is never cancelled.
concurrency:
  group: images-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: "images: build and scan ${{ matrix.service }}"
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [persistence, access, ingestion, processing]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install devbox toolchain
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true

      - name: Build for amd64 and arm64
        run: devbox run -- task "${SERVICE}:image" PLATFORMS=linux/amd64,linux/arm64 OUTPUT=type=cacheonly

      - name: Build the scan image
        run: devbox run -- task "${SERVICE}:image"

      - name: Scan with Trivy
        run: devbox run -- task "${SERVICE}:image:scan"

  publish:
    name: "images: publish ${{ matrix.service }}"
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [persistence, access, ingestion, processing]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Install devbox toolchain
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: false

      - name: Build the scan image
        run: devbox run -- task "${SERVICE}:image"

      - name: Scan with Trivy
        run: devbox run -- task "${SERVICE}:image:scan"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push for amd64 and arm64
        run: devbox run -- task "${SERVICE}:image" PLATFORMS=linux/amd64,linux/arm64 OUTPUT=type=registry
