[project]
name = "yieldlens-e2e"
version = "0.1.0"
description = "YieldLens end-to-end tests: the corrected-yield scenario against a running local stack"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28",
    "pytest>=8.3",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = ["error"]
