# OTEL_* for the api and job services, and the job OTEL endpoint the Airflow scheduler passes to the
# job containers it starts. The Taskfile adds this file through COMPOSE_FILE while the observability
# profile runs; without it the services get no OTEL_* settings.
services:
  persistence:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: persistence-api

  processing:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: processing-api

  access:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: access-api

  ingestion-api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ingestion-api

  ingestion:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: ingestion-job
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta

  processing-job:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: processing-job
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta

  airflow-scheduler:
    environment:
      YIELDLENS_JOB_OTEL_ENDPOINT: http://otel-collector:4318
