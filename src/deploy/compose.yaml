# Local development stack: the services of the VM, started by `task dev:*` (see
# docs/architecture/09-deployment.md). Oracle is extended from its service compose file;
# migrations, the persistence, processing and access apis, the ingestion api and job are defined here.
# Passwords come from the environment (the Taskfile sets local-only defaults).
# The observability profile (task dev:obs:up) is opt-in: see observability/ and compose.observability.yaml.
name: yieldlens-dev

x-liquibase: &liquibase
  image: liquibase/liquibase:4.33.0
  profiles: [tools]
  volumes:
    - ../services/persistence/db:/liquibase/changelog:ro
  command: [--search-path=/liquibase/changelog, update]

# Opt-in local Airflow (profile `airflow`). Job images are tagged for MR2 DockerOperator.
# Pin matches apache-airflow-providers-docker on PyPI for Airflow 3.3.x.
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-46BKJoT4wfZoK6Ez5JEh7Kk0rDYMqHOdGImQ2Kf9Xn0=}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-yieldlens_local_airflow_jwt}
  AIRFLOW__API_AUTH__JWT_ISSUER: airflow
  AIRFLOW_HOME: /opt/airflow
  # apache-airflow-providers-docker==4.6.1 (requires apache-airflow>=2.11.0)
  _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker==4.6.1
  YIELDLENS_INGESTION_JOB_IMAGE: yieldlens-ingestion:local
  YIELDLENS_PROCESSING_JOB_IMAGE: yieldlens-processing:local
  INGESTION_PERSISTENCE__URL: http://persistence:8001
  INGESTION_DB__DSN: oracle:1521/FREEPDB1
  INGESTION_DB__PASSWORD: ${INGESTION_DB__PASSWORD:?set INGESTION_DB__PASSWORD}
  PROCESSING_PERSISTENCE__URL: http://persistence:8001
  PROCESSING_DB__DSN: oracle:1521/FREEPDB1
  PROCESSING_DB__PASSWORD: ${PROCESSING_DB__PASSWORD:?set PROCESSING_DB__PASSWORD}
  YIELDLENS_DOCKER_NETWORK: yieldlens-dev_default
  PYTHONPATH: /opt/airflow/python_src

x-airflow-volumes: &airflow-volumes
  - ../orchestration/dags:/opt/airflow/dags:ro
  - ../orchestration/src:/opt/airflow/python_src:ro
  - ../orchestration/pools.json:/opt/airflow/pools/pools.json:ro

services:
  oracle:
    extends:
      file: ../services/persistence/compose.yaml
      service: oracle

  core-migrate-admin:
    <<: *liquibase
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      LIQUIBASE_COMMAND_USERNAME: system
      LIQUIBASE_COMMAND_PASSWORD: ${PERSISTENCE_DB_ADMIN_PASSWORD:?set PERSISTENCE_DB_ADMIN_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: admin/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
      CORE_PASSWORD: ${PERSISTENCE_DB_OWNER_PASSWORD:?set PERSISTENCE_DB_OWNER_PASSWORD}
      CORE_APP_PASSWORD: ${PERSISTENCE_DB_PASSWORD:?set PERSISTENCE_DB_PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy

  core-migrate:
    <<: *liquibase
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      LIQUIBASE_COMMAND_USERNAME: core
      LIQUIBASE_COMMAND_PASSWORD: ${PERSISTENCE_DB_OWNER_PASSWORD:?set PERSISTENCE_DB_OWNER_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: core/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
    depends_on:
      core-migrate-admin:
        condition: service_completed_successfully

  # ING schema: the same changelogs as src/services/ingestion/compose.yaml, run here
  # against the local Oracle. The SYSTEM password is the one Oracle is started with.
  ing-migrate-admin:
    <<: *liquibase
    volumes:
      - ../services/ingestion/db:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      LIQUIBASE_COMMAND_USERNAME: system
      LIQUIBASE_COMMAND_PASSWORD: ${PERSISTENCE_DB_ADMIN_PASSWORD:?set PERSISTENCE_DB_ADMIN_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: admin/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
      ING_PASSWORD: ${INGESTION_DB_OWNER_PASSWORD:?set INGESTION_DB_OWNER_PASSWORD}
      ING_APP_PASSWORD: ${INGESTION_DB__PASSWORD:?set INGESTION_DB__PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy

  ing-migrate:
    <<: *liquibase
    volumes:
      - ../services/ingestion/db:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      LIQUIBASE_COMMAND_USERNAME: ing
      LIQUIBASE_COMMAND_PASSWORD: ${INGESTION_DB_OWNER_PASSWORD:?set INGESTION_DB_OWNER_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: ing/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
    depends_on:
      ing-migrate-admin:
        condition: service_completed_successfully

  # PROC schema: the same changelogs as src/services/processing/compose.yaml, run here
  # against the local Oracle. The SYSTEM password is the one Oracle is started with.
  proc-migrate-admin:
    <<: *liquibase
    volumes:
      - ../services/processing/db:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      LIQUIBASE_COMMAND_USERNAME: system
      LIQUIBASE_COMMAND_PASSWORD: ${PERSISTENCE_DB_ADMIN_PASSWORD:?set PERSISTENCE_DB_ADMIN_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: admin/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
      PROC_PASSWORD: ${PROCESSING_DB_OWNER_PASSWORD:?set PROCESSING_DB_OWNER_PASSWORD}
      PROC_APP_PASSWORD: ${PROCESSING_DB__PASSWORD:?set PROCESSING_DB__PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy

  proc-migrate:
    <<: *liquibase
    volumes:
      - ../services/processing/db:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      LIQUIBASE_COMMAND_USERNAME: proc
      LIQUIBASE_COMMAND_PASSWORD: ${PROCESSING_DB_OWNER_PASSWORD:?set PROCESSING_DB_OWNER_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: proc/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
    depends_on:
      proc-migrate-admin:
        condition: service_completed_successfully

  processing:
    build:
      context: ..
      dockerfile: services/processing/Dockerfile
    environment:
      PROCESSING_DB__DSN: oracle:1521/FREEPDB1
      PROCESSING_DB__PASSWORD: ${PROCESSING_DB__PASSWORD:?set PROCESSING_DB__PASSWORD}
      PROCESSING_PERSISTENCE__URL: http://persistence:8001
    ports:
      - 127.0.0.1:${PROCESSING_PORT:-8002}:8002
    depends_on:
      oracle:
        condition: service_healthy
      persistence:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready', timeout=2)"]
      interval: 5s
      retries: 30

  persistence:
    build:
      context: ..
      dockerfile: services/persistence/Dockerfile
    environment:
      PERSISTENCE_DB_DSN: oracle:1521/FREEPDB1
      PERSISTENCE_DB_PASSWORD: ${PERSISTENCE_DB_PASSWORD:?set PERSISTENCE_DB_PASSWORD}
    ports:
      - 127.0.0.1:${PERSISTENCE_PORT:-8001}:8001
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2)"]
      interval: 5s
      retries: 30

  access:
    build:
      context: ..
      dockerfile: services/access/Dockerfile
    environment:
      ACCESS_PERSISTENCE_URL: http://persistence:8001
      ACCESS_PROCESSING_URL: http://processing:8002
      ACCESS_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5174}
      # Off unless the dev Taskfile turns it on: the Quality view can then start a check (a write).
      ACCESS_ALLOW_QUALITY_CHECKS: ${ACCESS_ALLOW_QUALITY_CHECKS:-false}
    ports:
      - 127.0.0.1:${ACCESS_PORT:-8000}:8000
    depends_on:
      persistence:
        condition: service_healthy
      processing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      retries: 30

  # One-shot ECB load job, started by `task dev:seed` (not a server). The image default CMD
  # is the api; this service sets the job entrypoint explicitly.
  ingestion:
    profiles: [tools, airflow]
    image: yieldlens-ingestion:local
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    entrypoint: [ingestion-load-ecb]
    environment:
      INGESTION_PERSISTENCE__URL: http://persistence:8001
      INGESTION_DB__DSN: oracle:1521/FREEPDB1
      INGESTION_DB__PASSWORD: ${INGESTION_DB__PASSWORD:?set INGESTION_DB__PASSWORD}
    depends_on:
      persistence:
        condition: service_healthy

  ingestion-api:
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    environment:
      INGESTION_DB__DSN: oracle:1521/FREEPDB1
      INGESTION_DB__PASSWORD: ${INGESTION_DB__PASSWORD:?set INGESTION_DB__PASSWORD}
    ports:
      - 127.0.0.1:${INGESTION_PORT:-8003}:8003
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/ready', timeout=2)"]
      interval: 5s
      retries: 30

  processing-job:
    profiles: [tools, airflow]
    image: yieldlens-processing:local
    build:
      context: ..
      dockerfile: services/processing/Dockerfile
    entrypoint: [processing-check-quality]
    environment:
      PROCESSING_PERSISTENCE__URL: http://persistence:8001
      PROCESSING_DB__DSN: oracle:1521/FREEPDB1
      PROCESSING_DB__PASSWORD: ${PROCESSING_DB__PASSWORD:?set PROCESSING_DB__PASSWORD}
    depends_on:
      persistence:
        condition: service_healthy
      oracle:
        condition: service_healthy

  airflow-postgres:
    profiles: [airflow]
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 30

  airflow-init:
    profiles: [airflow]
    image: apache/airflow:3.3.2
    user: "0:0"
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    volumes: *airflow-volumes
    depends_on:
      airflow-postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        mkdir -p /opt/airflow/logs
        /entrypoint
        /entrypoint airflow pools import /opt/airflow/pools/pools.json

  airflow-scheduler:
    profiles: [airflow]
    image: apache/airflow:3.3.2
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *airflow-env
    # Only the scheduler starts job containers (LocalExecutor), so only it mounts the socket.
    # Host docker group (DOCKER_GID, set by task dev:airflow:up): the socket is root:docker 660.
    volumes:
      - ../orchestration/dags:/opt/airflow/dags:ro
      - ../orchestration/src:/opt/airflow/python_src:ro
      - ../orchestration/pools.json:/opt/airflow/pools/pools.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:-0}"]
    command: scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    profiles: [airflow]
    image: apache/airflow:3.3.2
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *airflow-env
    volumes: *airflow-volumes
    command: dag-processor
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-apiserver:
    profiles: [airflow]
    image: apache/airflow:3.3.2
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *airflow-env
    volumes: *airflow-volumes
    command: api-server
    ports:
      - 127.0.0.1:${AIRFLOW_PORT:-8088}:8080
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # Opt-in observability (profile observability, task dev:obs:up): ADR 0009 without logs.
  # compose.observability.yaml adds OTEL_* to the api and job services.
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090

  tempo:
    profiles: [observability]
    image: grafana/tempo:3.1.0
    command: [-config.file=/etc/tempo/tempo.yaml]
    volumes:
      - ../observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - 127.0.0.1:${TEMPO_PORT:-3200}:3200

  # Copies every service's observability/ folder into the volumes Grafana provisions from; Grafana's
  # alerting provisioning reads one flat directory, so the folders cannot be mounted directly.
  grafana-provisioning:
    profiles: [observability]
    image: grafana/grafana:13.2.4
    user: "0"
    entrypoint: [/bin/sh, /yieldlens/gather-provisioning.sh]
    volumes:
      - ../observability/grafana/gather-provisioning.sh:/yieldlens/gather-provisioning.sh:ro
      - ../services:/yieldlens/services:ro
      - grafana-alerting:/out/alerting
      - grafana-dashboards:/out/dashboards

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.4
    depends_on:
      grafana-provisioning:
        condition: service_completed_successfully
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ../observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - grafana-alerting:/etc/grafana/provisioning/alerting:ro
      - grafana-dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # 3300 by default: port 3000 is often taken by other local Grafana stacks
      - 127.0.0.1:${GRAFANA_PORT:-3300}:3000

volumes:
  oracle-data:
  airflow-postgres-data:
  prometheus-data:
  tempo-data:
  grafana-alerting:
  grafana-dashboards:
