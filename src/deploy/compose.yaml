# Local development stack: the services of the VM, started by `task dev:*` (see
# docs/architecture/09-deployment.md). Oracle is extended from its service compose file;
# migrations, the persistence, processing and access apis, the ingestion api and job are defined here.
# Passwords come from the environment (the Taskfile sets local-only defaults).
name: yieldlens-dev

x-liquibase: &liquibase
  image: liquibase/liquibase:4.33.0
  profiles: [tools]
  volumes:
    - ../services/persistence/db:/liquibase/changelog:ro
  command: [--search-path=/liquibase/changelog, update]

services:
  oracle:
    extends:
      file: ../services/persistence/compose.yaml
      service: oracle

  core-migrate-admin:
    <<: *liquibase
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      LIQUIBASE_COMMAND_USERNAME: system
      LIQUIBASE_COMMAND_PASSWORD: ${PERSISTENCE_DB_ADMIN_PASSWORD:?set PERSISTENCE_DB_ADMIN_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: admin/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
      CORE_PASSWORD: ${PERSISTENCE_DB_OWNER_PASSWORD:?set PERSISTENCE_DB_OWNER_PASSWORD}
      CORE_APP_PASSWORD: ${PERSISTENCE_DB_PASSWORD:?set PERSISTENCE_DB_PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy

  core-migrate:
    <<: *liquibase
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      LIQUIBASE_COMMAND_USERNAME: core
      LIQUIBASE_COMMAND_PASSWORD: ${PERSISTENCE_DB_OWNER_PASSWORD:?set PERSISTENCE_DB_OWNER_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: core/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
    depends_on:
      core-migrate-admin:
        condition: service_completed_successfully

  # ING schema: the same changelogs as src/services/ingestion/compose.yaml, run here
  # against the local Oracle. The SYSTEM password is the one Oracle is started with.
  ing-migrate-admin:
    <<: *liquibase
    volumes:
      - ../services/ingestion/db:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      LIQUIBASE_COMMAND_USERNAME: system
      LIQUIBASE_COMMAND_PASSWORD: ${PERSISTENCE_DB_ADMIN_PASSWORD:?set PERSISTENCE_DB_ADMIN_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: admin/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
      ING_PASSWORD: ${INGESTION_DB_OWNER_PASSWORD:?set INGESTION_DB_OWNER_PASSWORD}
      ING_APP_PASSWORD: ${INGESTION_DB__PASSWORD:?set INGESTION_DB__PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy

  ing-migrate:
    <<: *liquibase
    volumes:
      - ../services/ingestion/db:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      LIQUIBASE_COMMAND_USERNAME: ing
      LIQUIBASE_COMMAND_PASSWORD: ${INGESTION_DB_OWNER_PASSWORD:?set INGESTION_DB_OWNER_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: ing/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
    depends_on:
      ing-migrate-admin:
        condition: service_completed_successfully

  # PROC schema: the same changelogs as src/services/processing/compose.yaml, run here
  # against the local Oracle. The SYSTEM password is the one Oracle is started with.
  proc-migrate-admin:
    <<: *liquibase
    volumes:
      - ../services/processing/db:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      LIQUIBASE_COMMAND_USERNAME: system
      LIQUIBASE_COMMAND_PASSWORD: ${PERSISTENCE_DB_ADMIN_PASSWORD:?set PERSISTENCE_DB_ADMIN_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: admin/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
      PROC_PASSWORD: ${PROCESSING_DB_OWNER_PASSWORD:?set PROCESSING_DB_OWNER_PASSWORD}
      PROC_APP_PASSWORD: ${PROCESSING_DB__PASSWORD:?set PROCESSING_DB__PASSWORD}
    depends_on:
      oracle:
        condition: service_healthy

  proc-migrate:
    <<: *liquibase
    volumes:
      - ../services/processing/db:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      LIQUIBASE_COMMAND_USERNAME: proc
      LIQUIBASE_COMMAND_PASSWORD: ${PROCESSING_DB_OWNER_PASSWORD:?set PROCESSING_DB_OWNER_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: proc/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
    depends_on:
      proc-migrate-admin:
        condition: service_completed_successfully

  processing:
    build:
      context: ..
      dockerfile: services/processing/Dockerfile
    environment:
      PROCESSING_DB__DSN: oracle:1521/FREEPDB1
      PROCESSING_DB__PASSWORD: ${PROCESSING_DB__PASSWORD:?set PROCESSING_DB__PASSWORD}
    ports:
      - 127.0.0.1:8002:8002
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/ready', timeout=2)"]
      interval: 5s
      retries: 30

  persistence:
    build:
      context: ..
      dockerfile: services/persistence/Dockerfile
    environment:
      PERSISTENCE_DB_DSN: oracle:1521/FREEPDB1
      PERSISTENCE_DB_PASSWORD: ${PERSISTENCE_DB_PASSWORD:?set PERSISTENCE_DB_PASSWORD}
    ports:
      - 127.0.0.1:8001:8001
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2)"]
      interval: 5s
      retries: 30

  access:
    build:
      context: ..
      dockerfile: services/access/Dockerfile
    environment:
      ACCESS_PERSISTENCE_URL: http://persistence:8001
      ACCESS_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5174}
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      persistence:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      retries: 30

  # One-shot ECB load job, started by `task dev:seed` (not a server). The image default CMD
  # is the api; this service sets the job entrypoint explicitly.
  ingestion:
    profiles: [tools]
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    entrypoint: [ingestion-load-ecb]
    environment:
      INGESTION_PERSISTENCE__URL: http://persistence:8001
      INGESTION_DB__DSN: oracle:1521/FREEPDB1
      INGESTION_DB__PASSWORD: ${INGESTION_DB__PASSWORD:?set INGESTION_DB__PASSWORD}
    depends_on:
      persistence:
        condition: service_healthy

  ingestion-api:
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    environment:
      INGESTION_DB__DSN: oracle:1521/FREEPDB1
      INGESTION_DB__PASSWORD: ${INGESTION_DB__PASSWORD:?set INGESTION_DB__PASSWORD}
    ports:
      - 127.0.0.1:8003:8003
    depends_on:
      oracle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/ready', timeout=2)"]
      interval: 5s
      retries: 30

  processing-job:
    profiles: [tools]
    build:
      context: ..
      dockerfile: services/processing/Dockerfile
    entrypoint: [processing-check-quality]
    environment:
      PROCESSING_PERSISTENCE__URL: http://persistence:8001
      PROCESSING_DB__DSN: oracle:1521/FREEPDB1
      PROCESSING_DB__PASSWORD: ${PROCESSING_DB__PASSWORD:?set PROCESSING_DB__PASSWORD}
    depends_on:
      persistence:
        condition: service_healthy
      oracle:
        condition: service_healthy

volumes:
  oracle-data:
