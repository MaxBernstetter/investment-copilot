# Local development stack tasks (docker compose project in this directory).
# Glue only: every command is a single binary call (see docs/architecture/13-build-and-ci.md).
# Included by the root Taskfile with this directory as working directory.
#
# Clashes with persistence:db:* (same port): stop that stack first.
version: "3"

# Local-only defaults for the development stack. Override any of them through the
# environment; never reuse them outside your machine.
env:
  PERSISTENCE_DB_ADMIN_PASSWORD: '{{.PERSISTENCE_DB_ADMIN_PASSWORD | default "LocalAdmin_1"}}'
  PERSISTENCE_DB_OWNER_PASSWORD: '{{.PERSISTENCE_DB_OWNER_PASSWORD | default "LocalOwner_1"}}'
  PERSISTENCE_DB_PASSWORD: '{{.PERSISTENCE_DB_PASSWORD | default "LocalApp_1"}}'
  INGESTION_DB_OWNER_PASSWORD: '{{.INGESTION_DB_OWNER_PASSWORD | default "LocalIngOwner_1"}}'
  INGESTION_DB__PASSWORD: '{{.INGESTION_DB__PASSWORD | default "LocalIngApp_1"}}'
  PROCESSING_DB_OWNER_PASSWORD: '{{.PROCESSING_DB_OWNER_PASSWORD | default "LocalProcOwner_1"}}'
  PROCESSING_DB__PASSWORD: '{{.PROCESSING_DB__PASSWORD | default "LocalProcApp_1"}}'

tasks:
  up:
    desc: Start the local stack and wait until it is healthy (idempotent)
    cmds:
      - docker compose up --detach --wait oracle
      - docker compose --profile tools run --rm core-migrate
      - docker compose --profile tools run --rm ing-migrate
      - docker compose --profile tools run --rm proc-migrate
      - docker compose up --detach --wait --build persistence access processing ingestion-api

  down:
    desc: Stop the local stack (keeps its data)
    cmds:
      - docker compose --profile tools down

  reset:
    desc: Remove the local stack and its data
    cmds:
      - docker compose --profile tools down --volumes --remove-orphans

  scenario:corrected-yield:
    desc: Run the corrected-yield scenario on the simulated curve ecb-aaa-spot-sim (no source call; real curves untouched)
    cmds:
      - docker compose --profile tools run --rm --build --entrypoint ingestion-scenario ingestion corrected-yield
      - docker compose --profile tools run --rm --build processing-job ecb-aaa-spot-sim --from 2026-10-05 --to 2026-10-08

  check-quality:
    desc: Run a quality check for CURVE between FROM and TO on the local stack
    cmds:
      - docker compose --profile tools run --rm --build processing-job {{.CURVE}} --from {{.FROM}} --to {{.TO}}

  e2e:
    desc: End-to-end corrected-yield test against a fresh running stack (task dev:reset dev:up first)
    cmds:
      - uv run --project ../e2e --locked pytest ../e2e/tests

  seed:
    desc: Load ECB history at two knowledge times (live ECB calls)
    vars:
      START: '{{.START | default "2024-01-01"}}'
    cmds:
      - ../scripts/dev-seed.sh {{.START}}

  compose:config:
    desc: Validate the deploy compose file including the Airflow profile
    cmds:
      - docker compose --profile airflow config

  airflow:up:
    desc: Build job images and start the Airflow profile (opt-in; default stack unchanged)
    vars:
      DOCKER_GID:
        sh: stat -c %g /var/run/docker.sock 2>/dev/null || stat -f %g /var/run/docker.sock
    env:
      DOCKER_GID: '{{.DOCKER_GID}}'
    cmds:
      - docker compose --profile airflow build ingestion processing-job
      - docker compose --profile airflow up --detach --wait airflow-postgres airflow-init airflow-scheduler airflow-dag-processor airflow-apiserver

  airflow:down:
    desc: Stop the Airflow profile (does not tear down the default stack)
    vars:
      DOCKER_GID:
        sh: stat -c %g /var/run/docker.sock 2>/dev/null || stat -f %g /var/run/docker.sock
    env:
      DOCKER_GID: '{{.DOCKER_GID}}'
    cmds:
      - docker compose --profile airflow down airflow-postgres airflow-init airflow-scheduler airflow-dag-processor airflow-apiserver
