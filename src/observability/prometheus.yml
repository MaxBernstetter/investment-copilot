# Scrapes the collector's Prometheus exporter. honor_labels keeps the job and instance labels
# that the collector sets from the OTLP resource.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
