# OpenTelemetry Collector for the local observability profile (ADR 0009 without logs).
# The apis and jobs export OTLP here; metrics go to Prometheus, traces to Tempo.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  resource/drop-instance:
    # short-lived jobs: one series per label set, not per run
    attributes:
      - key: service.instance.id
        action: delete
  deltatocumulative: {}  # jobs export delta; Prometheus needs cumulative
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  otlp_grpc/tempo:  # type is otlp_grpc since 0.163 (otlp is a deprecated alias)
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource/drop-instance, deltatocumulative, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
