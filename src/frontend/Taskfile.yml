# Frontend tasks: the React web app (npm project in this directory).
# Glue only: every command is a single npm call (see docs/architecture/13-build-and-ci.md).
version: "3"

tasks:
  setup:
    desc: Install the npm dependencies from the lockfile
    sources:
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm ci

  fmt:
    desc: Format and auto-fix the TypeScript code (ESLint --fix)
    deps: [setup]
    cmds:
      - npm run lint -- --fix

  lint:
    desc: Lint the TypeScript code with ESLint
    deps: [setup]
    cmds:
      - npm run lint

  typecheck:
    desc: Type-check the app and the tooling config with tsc
    deps: [setup]
    cmds:
      - npm run typecheck

  test:unit:
    desc: Run the unit tests with Vitest
    deps: [setup]
    cmds:
      - npm run test

  build:
    desc: Build the production bundle with Vite
    deps: [setup]
    cmds:
      - npm run build

  dev:
    desc: Start the Vite dev server
    deps: [setup]
    cmds:
      - npm run dev
