# Frontend tasks: the React web app (npm project in this directory).
# Glue only: every command is a single npm call (see docs/architecture/13-build-and-ci.md).
version: "3"

tasks:
  setup:
    desc: Install the npm dependencies from the lockfile
    sources:
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm ci

  fmt:
    desc: Format and auto-fix the TypeScript code (ESLint --fix)
    deps: [setup]
    cmds:
      - npm run lint -- --fix

  generate:
    desc: Generate the access API types
    deps: [setup]
    sources:
      - ../contracts/openapi/access/v1.json
    generates:
      - src/api/schema.d.ts
    cmds:
      - npx openapi-typescript ../contracts/openapi/access/v1.json -o src/api/schema.d.ts

  audit:
    desc: Fail on high or critical npm audit findings
    deps: [setup]
    cmds:
      - npm audit --audit-level=high

  lint:
    desc: Lint the TypeScript code with ESLint
    deps: [generate]
    cmds:
      - npm run lint

  typecheck:
    desc: Type-check the app and the tooling config with tsc
    deps: [generate]
    cmds:
      - npm run typecheck

  test:unit:
    desc: Run the unit tests with Vitest
    deps: [generate]
    cmds:
      - npm run test

  build:
    desc: Build the production bundle with Vite
    deps: [generate]
    vars:
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo dev
    env:
      VITE_COMMIT: '{{.COMMIT}}'
    cmds:
      - npm run build

  build:pages:
    desc: Build the bundle for GitHub Pages (base /yield-lens/); needs VITE_ACCESS_URL
    deps: [generate]
    vars:
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo dev
    env:
      VITE_COMMIT: '{{.COMMIT}}'
    cmds:
      - npm run build -- --mode pages
      - grep -q 'src="/yield-lens/assets/' dist/index.html

  size:
    desc: Check the bundle budget
    deps: [build]
    cmds:
      - npm run size

  e2e:
    desc: Playwright visual, accessibility, layout and keyboard checks
    deps: [generate]
    env:
      VITE_COMMIT: dev
    cmds:
      - npm run build
      - npx playwright install chromium
      - npm run e2e

  e2e:update:
    desc: Re-baseline Playwright screenshots (designer approval required)
    deps: [generate]
    env:
      VITE_COMMIT: dev
    cmds:
      - npm run build
      - npx playwright install chromium
      - npm run e2e:update

  dev:
    desc: Start the Vite dev server
    deps: [generate]
    cmds:
      - npm run dev
