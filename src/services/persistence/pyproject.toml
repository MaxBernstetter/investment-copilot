[project]
name = "persistence"
version = "0.1.0"
description = "YieldLens persistence service: the bitemporal core (CORE schema)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "oracledb>=3.0",
]

[dependency-groups]
dev = [
    "docker>=7.1",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff==0.17.1",
    "testcontainers>=4.10",
    "types-docker>=7.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
