# CORE changelog: the bitemporal observation store and its PL/SQL interface.
# Runs as the schema owner CORE. Never edit an applied changeset; add a new one
# (expand/contract). Packages are re-applied when they change (runOnChange).
databaseChangeLog:
  - include:
      file: observation.sql
      relativeToChangelogFile: true
  - include:
      file: observation_version_types.sql
      relativeToChangelogFile: true
  # Before the package: record_versions validates against the grid.
  - include:
      file: 19_curve_reference_data.sql
      relativeToChangelogFile: true
  - include:
      file: 19_normalization_version.sql
      relativeToChangelogFile: true
  - include:
      file: 20_delivery_id.sql
      relativeToChangelogFile: true
  # Before the package: record_versions locks and advances the clock.
  - include:
      file: 21_knowledge_clock.sql
      relativeToChangelogFile: true
  # Simulated curves are flagged on the curve table before the package validates them.
  - include:
      file: 22_simulated_curve.sql
      relativeToChangelogFile: true
  - include:
      file: core_observation.sql
      relativeToChangelogFile: true
  - include:
      file: grants.sql
      relativeToChangelogFile: true
