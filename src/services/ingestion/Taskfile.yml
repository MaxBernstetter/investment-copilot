# Ingestion service tasks. Glue only: every command is a single binary call
# (see docs/architecture/13-build-and-ci.md). Included by the root Taskfile with
# this directory as working directory.
version: "3"

# Local-only defaults: the persistence api started by `task persistence:run`, and the
# Oracle database started by `task persistence:db:start` (one instance, one schema per
# service). Override any of them through the environment; never reuse them elsewhere.
env:
  INGESTION_PERSISTENCE__URL: '{{.INGESTION_PERSISTENCE__URL | default "http://localhost:8001"}}'
  INGESTION_DB_ADMIN_PASSWORD: '{{.INGESTION_DB_ADMIN_PASSWORD | default "LocalAdmin_1"}}'
  INGESTION_DB_OWNER_PASSWORD: '{{.INGESTION_DB_OWNER_PASSWORD | default "LocalIngOwner_1"}}'
  INGESTION_DB__PASSWORD: '{{.INGESTION_DB__PASSWORD | default "LocalIngApp_1"}}'
  INGESTION_DB__DSN: '{{.INGESTION_DB__DSN | default "localhost:1521/FREEPDB1"}}'

vars:
  PORT: '{{.PORT | default "8003"}}'

tasks:
  setup:
    desc: Create the virtual environment from the lockfile
    cmds:
      - uv sync --locked

  fmt:
    desc: Format the code and apply safe lint fixes
    cmds:
      - uv run --locked ruff format .
      - uv run --locked ruff check --fix .

  lint:
    desc: Lint, check formatting and the layer rules
    cmds:
      - uv run --locked ruff check .
      - uv run --locked ruff format --check .
      - uv run --locked lint-imports

  typecheck:
    desc: Type-check sources and tests (mypy strict)
    cmds:
      - uv run --locked mypy

  test:unit:
    desc: Run the unit tests (no I/O, no live sources)
    cmds:
      - uv run --locked pytest tests/unit

  test:integration:
    desc: Run the integration tests against Oracle Free (Testcontainers; includes the utPLSQL suites)
    cmds:
      - uv run --locked pytest tests/integration

  db:migrate:
    desc: Apply the ING changelogs (admin as SYSTEM, then ING as its owner) to the local database
    cmds:
      - docker compose run --rm migrate

  load:ecb:daily:
    desc: Load the ECB curve for VALID_DATE and its lookback window (live ECB call; manual only)
    requires:
      vars: [VALID_DATE]
    cmds:
      - uv run --locked ingestion-load-ecb daily --valid-date {{.VALID_DATE}}

  load:ecb:history:
    desc: Load the ECB curve from START to END, one request per year (live ECB calls; manual only)
    requires:
      vars: [START, END]
    cmds:
      - uv run --locked ingestion-load-ecb history --start {{.START}} --end {{.END}}

  load:ecb:replay:
    desc: Parse the ECB deliveries stored in ING and fetched FROM to TO (UTC days) again and record them (no ECB call)
    requires:
      vars: [FROM, TO]
    cmds:
      - uv run --locked ingestion-load-ecb replay --fetched-from {{.FROM}} --fetched-to {{.TO}}

  scenario:
    desc: Write a scenario's events to its simulated curve (no source call; NAME is the scenario)
    requires:
      vars: [NAME]
    cmds:
      - uv run --locked ingestion-scenario {{.NAME}}

  openapi:
    desc: Export the ingestion OpenAPI document
    cmds:
      - uv run --locked ingestion-openapi ../../contracts/openapi/ingestion/v1.json

  run:
    desc: Run the api process locally on PORT (default 8003) against the ING database
    cmds:
      - uv run --locked uvicorn --factory ingestion.api:create_app_from_environment --port {{.PORT}} --log-config log_config.json
