# Admin changelog: creates the ING schema owner and the ingestion runtime user.
# Runs as an administrative user (SYSTEM) against the pluggable database.
# Passwords come from the changelog parameters ING_PASSWORD and ING_APP_PASSWORD
# (environment variables of the Liquibase process).
# See docs/project/00-data-ingestion/04-raw-deliveries.md.
databaseChangeLog:
  - include:
      file: ing_users.sql
      relativeToChangelogFile: true
