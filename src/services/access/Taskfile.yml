# Access service tasks (uv project in this directory). Glue only: every command is a single
# binary call (see docs/architecture/13-build-and-ci.md).
version: "3"

# Local-only default: the persistence api started by `task persistence:run`.
env:
  ACCESS_PERSISTENCE_URL: '{{.ACCESS_PERSISTENCE_URL | default "http://localhost:8001"}}'
  ACCESS_PROCESSING_URL: '{{.ACCESS_PROCESSING_URL | default "http://localhost:8002"}}'

vars:
  PORT: '{{.PORT | default "8000"}}'

tasks:
  setup:
    desc: Create the virtual environment from the lockfile
    cmds:
      - uv sync --locked

  fmt:
    desc: Format and auto-fix the Python code
    cmds:
      - uv run --locked ruff format
      - uv run --locked ruff check --fix

  lint:
    desc: Lint the Python code, check its formatting and the layer rules
    cmds:
      - uv run --locked ruff check
      - uv run --locked ruff format --check
      - uv run --locked lint-imports

  typecheck:
    desc: Type-check with mypy (strict)
    cmds:
      - uv run --locked mypy

  test:unit:
    desc: Run the unit tests (domain, use cases, REST facade, persistence client; no real I/O)
    cmds:
      - uv run --locked pytest tests/unit

  openapi:
    desc: Export the access OpenAPI document
    cmds:
      - uv run --locked access-openapi ../../contracts/openapi/access/v1.json

  run:
    desc: Run the api process locally on PORT (default 8000) against the persistence service
    cmds:
      - uv run --locked uvicorn --factory access.api:create_app_from_environment --port {{.PORT}} --log-config log_config.json

  image:
    desc: Build the image IMAGE:TAG (default the commit) for PLATFORMS (default the host) to OUTPUT (type=docker loads it locally, type=cacheonly only builds, type=registry pushes)
    vars:
      HEAD:
        sh: git rev-parse HEAD
      IMAGE: '{{.IMAGE | default "ghcr.io/maxbernstetter/yield-lens-access"}}'
      TAG: '{{.TAG | default .HEAD}}'
      PLATFORMS: '{{.PLATFORMS | default (print "linux/" ARCH)}}'
      OUTPUT: '{{.OUTPUT | default "type=docker"}}'
    cmds:
      - docker buildx build --platform {{.PLATFORMS}} --output {{.OUTPUT}} --tag {{.IMAGE}}:{{.TAG}} --file Dockerfile ../..

  image:scan:
    desc: Scan the image IMAGE:TAG (default the commit) with Trivy; fails on fixable HIGH or CRITICAL vulnerabilities
    vars:
      HEAD:
        sh: git rev-parse HEAD
      IMAGE: '{{.IMAGE | default "ghcr.io/maxbernstetter/yield-lens-access"}}'
      TAG: '{{.TAG | default .HEAD}}'
    cmds:
      - trivy image --config ../../../trivy.yaml {{.IMAGE}}:{{.TAG}}
