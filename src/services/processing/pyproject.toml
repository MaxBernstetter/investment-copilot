[project]
name = "processing"
version = "0.1.0"
description = "YieldLens processing service: quality checks on the published curves (phase 2)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "oracledb>=3.0",
    "pydantic-settings>=2.8",
    "python-dateutil>=2.9",
    "python-json-logger>=3.3",
    "uvicorn>=0.34",
    "yieldlens-contracts",
]

[dependency-groups]
dev = [
    "docker>=7.1",
    "httpx2>=2.13",
    "import-linter>=2.3",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff==0.17.1",
    "testcontainers>=4.10",
    "types-docker>=7.1",
    "types-python-dateutil>=2.9",
]

[tool.uv.sources]
yieldlens-contracts = { path = "../../contracts", editable = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.importlinter]
root_packages = ["processing"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers point inward"
type = "layers"
layers = [
    "processing.api",
    "processing.facade | processing.infrastructure",
    "processing.application",
    "processing.domain",
]

[[tool.importlinter.contracts]]
name = "The domain and use cases have no I/O, frameworks or contracts"
type = "forbidden"
source_modules = ["processing.domain", "processing.application"]
forbidden_modules = ["contracts", "httpx", "oracledb", "fastapi", "pydantic", "pydantic_settings"]
