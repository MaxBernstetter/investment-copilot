# Admin changelog: creates the PROC schema owner and the processing runtime user.
# Runs as an administrative user (SYSTEM) against the pluggable database.
# Passwords come from the changelog parameters PROC_PASSWORD and PROC_APP_PASSWORD
# (environment variables of the Liquibase process).
# See docs/architecture/03-data-architecture.md.
databaseChangeLog:
  - include:
      file: proc_users.sql
      relativeToChangelogFile: true
