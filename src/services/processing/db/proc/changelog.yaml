# PROC changelog: the quality check results and their storage.
# Runs as the schema owner PROC. Never edit an applied changeset; add a new one
# (expand/contract).
databaseChangeLog:
  - include:
      file: check_run.sql
      relativeToChangelogFile: true
  - include:
      file: quality_types.sql
      relativeToChangelogFile: true
  - include:
      file: proc_quality.sql
      relativeToChangelogFile: true
  - include:
      file: grants.sql
      relativeToChangelogFile: true
