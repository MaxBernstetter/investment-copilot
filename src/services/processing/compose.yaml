# PROC migrations for local development: Liquibase against the local Oracle Free
# started by `task persistence:db:start` (one instance, one schema per service).
# Used by `task processing:db:migrate`; tests use Testcontainers.
# Passwords and the database URL come from the environment (the Taskfile sets
# local-only defaults).
name: yieldlens-processing

x-liquibase: &liquibase
  image: liquibase/liquibase:4.33.0
  network_mode: host
  volumes:
    - ./db:/liquibase/changelog:ro
  command: [--search-path=/liquibase/changelog, update]

services:
  migrate-admin:
    <<: *liquibase
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//${PROCESSING_DB__DSN:?set PROCESSING_DB__DSN}
      LIQUIBASE_COMMAND_USERNAME: system
      LIQUIBASE_COMMAND_PASSWORD: ${PROCESSING_DB_ADMIN_PASSWORD:?set PROCESSING_DB_ADMIN_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: admin/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
      PROC_PASSWORD: ${PROCESSING_DB_OWNER_PASSWORD:?set PROCESSING_DB_OWNER_PASSWORD}
      PROC_APP_PASSWORD: ${PROCESSING_DB__PASSWORD:?set PROCESSING_DB__PASSWORD}

  migrate:
    <<: *liquibase
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:oracle:thin:@//${PROCESSING_DB__DSN:?set PROCESSING_DB__DSN}
      LIQUIBASE_COMMAND_USERNAME: proc
      LIQUIBASE_COMMAND_PASSWORD: ${PROCESSING_DB_OWNER_PASSWORD:?set PROCESSING_DB_OWNER_PASSWORD}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: proc/changelog.yaml
      LIQUIBASE_SHOW_BANNER: "false"
    depends_on:
      migrate-admin:
        condition: service_completed_successfully
