# Processing service tasks (uv project in this directory). Glue only: every command is a single
# binary call (see docs/architecture/13-build-and-ci.md).
version: "3"

# Local-only defaults for the development database. Override them through the environment;
# never reuse them outside your machine.
env:
  PROCESSING_DB_ADMIN_PASSWORD: '{{.PROCESSING_DB_ADMIN_PASSWORD | default "LocalAdmin_1"}}'
  PROCESSING_DB_OWNER_PASSWORD: '{{.PROCESSING_DB_OWNER_PASSWORD | default "LocalProcOwner_1"}}'
  PROCESSING_DB__DSN: '{{.PROCESSING_DB__DSN | default (printf "localhost:%s/FREEPDB1" (.PERSISTENCE_DB_PORT | default "1521"))}}'
  PROCESSING_DB__PASSWORD: '{{.PROCESSING_DB__PASSWORD | default "LocalProcApp_1"}}'
  PROCESSING_PERSISTENCE__URL: '{{.PROCESSING_PERSISTENCE__URL | default (printf "http://localhost:%s" (.PERSISTENCE_PORT | default "8001"))}}'

vars:
  PORT: '{{.PORT | default (.PROCESSING_PORT | default "8002")}}'

tasks:
  setup:
    desc: Create the virtual environment from the lockfile
    cmds:
      - uv sync --locked

  fmt:
    desc: Format and auto-fix the Python code
    cmds:
      - uv run --locked ruff format
      - uv run --locked ruff check --fix

  lint:
    desc: Lint the Python code, check its formatting and the layer rules
    cmds:
      - uv run --locked ruff check
      - uv run --locked ruff format --check
      - uv run --locked lint-imports

  typecheck:
    desc: Type-check with mypy (strict)
    cmds:
      - uv run --locked mypy

  test:unit:
    desc: Run the unit tests (domain, use cases, REST facade, configuration; no real I/O)
    cmds:
      - uv run --locked pytest tests/unit

  test:integration:
    desc: Run the integration tests against Oracle Free (Testcontainers; applies the PROC migrations)
    cmds:
      - uv run --locked pytest tests/integration

  db:migrate:
    desc: Apply the PROC changelogs (admin as SYSTEM, then PROC as its owner) to the local database
    cmds:
      - docker compose run --rm migrate

  run:
    desc: Run the api process locally on PORT (default 8002) against the processing database
    cmds:
      - uv run --locked uvicorn --factory processing.api:create_app_from_environment --port {{.PORT}} --log-config log_config.json

  openapi:
    desc: Export the processing OpenAPI document
    cmds:
      - uv run --locked processing-openapi ../../contracts/openapi/processing/v1.json

  check-quality:
    desc: Run a quality check for CURVE between FROM and TO (inclusive valid dates)
    cmds:
      - uv run --locked processing-check-quality {{.CURVE}} --from {{.FROM}} --to {{.TO}}

  image:
    desc: Build the image IMAGE:TAG (default the commit) for PLATFORMS (default the host) to OUTPUT (type=docker loads it locally, type=cacheonly only builds, type=registry pushes)
    vars:
      HEAD:
        sh: git rev-parse HEAD
      IMAGE: '{{.IMAGE | default "ghcr.io/maxbernstetter/yield-lens-processing"}}'
      TAG: '{{.TAG | default .HEAD}}'
      PLATFORMS: '{{.PLATFORMS | default (print "linux/" ARCH)}}'
      OUTPUT: '{{.OUTPUT | default "type=docker"}}'
    cmds:
      - docker buildx build --platform {{.PLATFORMS}} --output {{.OUTPUT}} --tag {{.IMAGE}}:{{.TAG}} --file Dockerfile ../..

  image:scan:
    desc: Scan the image IMAGE:TAG (default the commit) with Trivy; fails on fixable HIGH or CRITICAL vulnerabilities
    vars:
      HEAD:
        sh: git rev-parse HEAD
      IMAGE: '{{.IMAGE | default "ghcr.io/maxbernstetter/yield-lens-processing"}}'
      TAG: '{{.TAG | default .HEAD}}'
    cmds:
      - trivy image --config ../../../trivy.yaml {{.IMAGE}}:{{.TAG}}
