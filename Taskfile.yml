# Root entry point for every development and CI task. Only includes components.
# Run `task --list` for the menu. See docs/architecture/13-build-and-ci.md.
version: "3"

# Local port and password overrides; see .env.example. Absent file is fine.
dotenv: [".env"]

includes:
  toolchain:
    taskfile: ./src/toolchain
    dir: .
  contracts:
    taskfile: ./src/contracts
    dir: ./src/contracts
  persistence:
    taskfile: ./src/services/persistence
    dir: ./src/services/persistence
  access:
    taskfile: ./src/services/access
    dir: ./src/services/access
  processing:
    taskfile: ./src/services/processing
    dir: ./src/services/processing
  ingestion:
    taskfile: ./src/services/ingestion
    dir: ./src/services/ingestion
  orchestration:
    taskfile: ./src/orchestration
    dir: ./src/orchestration
  frontend:
    taskfile: ./src/frontend
    dir: ./src/frontend
  dev:
    taskfile: ./src/deploy
    dir: ./src/deploy
  caddy:
    taskfile: ./src/deploy/caddy
    dir: ./src/deploy/caddy
  deploy:
    taskfile: ./src/deploy/Taskfile.vm.yml
    dir: ./src/deploy

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  stack:up:
    desc: Start everything locally (Oracle, APIs, seed data, explorer); idempotent
    cmds:
      - src/scripts/stack.sh up

  stack:down:
    desc: Stop the explorer and the local stack (keeps the data)
    cmds:
      - src/scripts/stack.sh down
